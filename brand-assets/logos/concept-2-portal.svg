<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept 2 — Portal mark + wordmark.
  Two concentric squared frames suggesting "passing through" infrastructure layers;
  a coral arrow inside hints at deploy direction.
  Mark stands alone at small sizes (favicon, app icon).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-label="cloudless">
  <title>cloudless</title>
  <style>
    .word { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 80px; letter-spacing: -0.04em; }
    .ink  { fill: #0F1B2D; }
    .spark { fill: #FF5C39; }
    .stroke-ink { fill: none; stroke: #0F1B2D; stroke-width: 8; }
  </style>
  <!-- Outer frame -->
  <rect x="14" y="14" width="112" height="112" rx="10" class="stroke-ink"/>
  <!-- Inner frame -->
  <rect x="38" y="38" width="64" height="64" rx="6" class="stroke-ink"/>
  <!-- Coral spark arrow -->
  <path d="M58 70 L94 70 M82 56 L94 70 L82 84" fill="none" stroke="#FF5C39" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark -->
  <text x="160" y="100" class="word ink">cloudless</text>
  <circle cx="548" cy="94" r="10" class="spark"/>
</svg>
